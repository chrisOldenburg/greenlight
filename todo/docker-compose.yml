services:
  todo:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?API_KEY fehlt}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      DB_PATH: /data/tasks.db
      DISPLAY_LIMIT: ${DISPLAY_LIMIT:-12}
      KEEP_DONE_DAYS: ${KEEP_DONE_DAYS:-30}
    volumes:
      - todo-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  todo-data:
